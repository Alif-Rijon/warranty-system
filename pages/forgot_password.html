
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | WarrantyDesk</title>

  <link rel="icon" href="../images/favicon.ico">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/status.css">

  <link rel="stylesheet" href="../css/technician.css">

  <script src="../js/technician.js" defer></script>
</head>

<body class="technician-page">

  <header class="header">
    <div class="brand">WarrantyDesk</div>
    <div class="user">Account Recovery</div>
  </header>

  <main class="main technician-auth-card">

    <div class="page-title">
      <h1>Forgot Password</h1>
    </div>

    <section class="box" aria-label="Password recovery">

      <p class="technician-note">
        Password resets are administrator-assisted in
        the first version of WarrantyDesk.
        Enter your registered email address to
        prepare a password reset request.
      </p>

      <form id="forgot-form" novalidate>

        <div class="form-row">

          <label for="forgot-email">
            Registered Email
            <span class="technician-required"
                  aria-hidden="true">*</span>
          </label>

          <input
            type="email"
            id="forgot-email"
            name="email"
            autocomplete="email"
            placeholder="Enter your registered email"
            aria-describedby="forgot-email-error"
            required
          >

          <span
            id="forgot-email-error"
            class="technician-error"
            aria-live="polite">
          </span>

        </div>

        <button type="submit" class="btn">
          Prepare Reset Request
        </button>

        <p
          id="forgot-success"
          class="technician-message"
          role="status"
          aria-live="polite">
        </p>

      </form>

      <p class="technician-note">
        Remember your password?
        <a href="login.html">Back to Login</a>
      </p>

    </section>

  </main>

  <footer class="footer">
    &copy; 2026 WarrantyDesk
  </footer>

</body>

</html>
