
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Change Password | WarrantyDesk</title>

  <link rel="icon" href="../images/favicon.ico">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/status.css">

  <link rel="stylesheet" href="../css/technician.css">

  <script src="../js/technician.js" defer></script>
</head>

<body class="technician-page">

  <header class="header">
    <div class="brand">WarrantyDesk</div>
    <div class="user">Service Technician</div>
  </header>

  <div class="wrapper">

    <nav class="sidebar" aria-label="Technician navigation">

      <div class="menu-title">Technician</div>

      <a href="technician_dashboard.html">
        Dashboard
      </a>

      <a href="technician_jobs.html">
        Assigned Jobs
      </a>

      <a href="technician_service_log.html">
        Claim Details
      </a>

      <a href="profile.html">
        Profile
      </a>

      <a href="change_password.html"
         class="active"
         aria-current="page">
        Change Password
      </a>

      <a href="login.html">
        Logout
      </a>

    </nav>

    <main class="main">

      <div class="page-title">
        <h1>Change Password</h1>
      </div>

      <section class="box technician-form-limit"
               aria-label="Change password form">

        <form id="password-form" novalidate>

          <div class="form-row">

            <label for="current-password">
              Current Password
              <span class="technician-required"
                    aria-hidden="true">*</span>
            </label>

            <input
              type="password"
              id="current-password"
              name="currentPassword"
              autocomplete="current-password"
              aria-describedby="current-password-error"
              required
            >

            <span
              id="current-password-error"
              class="technician-error"
              aria-live="polite">
            </span>

          </div>

          <div class="form-row">

            <label for="new-password">
              New Password
              <span class="technician-required"
                    aria-hidden="true">*</span>
            </label>

            <input
              type="password"
              id="new-password"
              name="newPassword"
              minlength="8"
              autocomplete="new-password"
              aria-describedby="new-password-note new-password-error"
              required
            >

            <p id="new-password-note" class="form-note">
              Password must contain at least 8 characters.
            </p>

            <span
              id="new-password-error"
              class="technician-error"
              aria-live="polite">
            </span>

          </div>

          <div class="form-row">

            <label for="confirm-password">
              Confirm New Password
              <span class="technician-required"
                    aria-hidden="true">*</span>
            </label>

            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              autocomplete="new-password"
              aria-describedby="confirm-password-error"
              required
            >

            <span
              id="confirm-password-error"
              class="technician-error"
              aria-live="polite">
            </span>

          </div>

          <div class="technician-actions">

            <button type="submit" class="btn">
              Change Password
            </button>

            <a href="profile.html" class="btn btn-gray">
              Cancel
            </a>

          </div>

          <p
            id="password-success"
            class="technician-message technician-success"
            role="status"
            aria-live="polite">
          </p>

        </form>

      </section>

    </main>

  </div>

  <footer class="footer">
    &copy; 2026 WarrantyDesk
  </footer>

</body>
</html>
